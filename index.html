<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato-hero-clone</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
    <!-- Zomato hero clone -->
    <section class="hero-video">
      
        <video autoplay muted loop playsinline>
            <source src="https://b.zmtcdn.com/data/file_assets/2627bbed9d6c068e50d2aadcca11ddbb1743095810.mp4" type="video/mp4">
            Your browser does not support video tags
        </video>
        <div class="bottom-gradient"></div>
       
        <div class="header">
            
            <div class="main-head">
                <h1><b><i>Zomato</i></b></h1>            </div>
            <div class="sub-head">
                <h2>India's #1<br>food delivery app</h2>
            </div>
            <div class="tag-line">
                <h3>Experience fast & easy online ordering<br>on the Zomato app</h3>
            </div>
        </div>

        <!-- download links -->
        <div class="redirection">
            <div class="play-store">
                <div class="image"><img src="public/play-store.jpg" class="google"></div>
                <div class="text">
                    <p>GET IT ON</p>
                    <h3>Google Play</h4>
                </div> 
            </div>
            <div class="apple-store">
                <div class="image"><img src="public/apple-store.jpg" class="apple"></div>
                <div class="text">
                    <p>Download on the</p>
                <h3>App Store</h4>
                </div> 
            </div>
        </div>
    </section>
</body>
</html>
